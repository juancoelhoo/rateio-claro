name: Build e testes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m coverage run manage.py test
      - run: python -m coverage xml -o coverage-python.xml
      - run: npm ci
      - run: npm run build
      - run: npm run coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          files: coverage/lcov.info,coverage-python.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
  publicar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar deploy da aplicação Django
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --output /dev/null --request POST "$DEPLOY_HOOK"
